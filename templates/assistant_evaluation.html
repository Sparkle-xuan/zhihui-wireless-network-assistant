<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>问数测试台 · 智徽</title><link rel="stylesheet" href="/static/analysis-report.css"><link rel="stylesheet" href="/static/evaluation.css"><link rel="stylesheet" href="/static/assistant.css"></head><body><header class="top"><a href="/">← 返回工作台</a><span>智徽 · 无线网络感知分析助手</span></header><main><div class="heading"><div><h1>问数测试台</h1><div>使用模拟数据验证已接入的问题识别、计算和缺数提示。</div></div><span class="badge">本机测试</span></div><section class="controls"><div class="preview-head"><div><h2>测试结果</h2><p>仅运行本地规则和模拟数据，不调用 DeepSeek；通过不代表所有自然语言问题均已覆盖。</p></div><button type="button" id="evaluation-run">运行测试</button></div><p id="evaluation-status" role="status" aria-live="polite">点击运行测试。</p><label>分类 <select id="evaluation-filter"><option value="">全部</option><option>黑点</option><option>挂起库</option><option>网络日报</option><option>计算与缺数</option><option>其他</option></select></label><div id="evaluation-results"></div></section><section class="controls"><h2>添加人工确认的测试题</h2><p>填写问题并选择预期路由。自定义题仅检查意图识别，不自动修改查询规则；最多保存 200 条。</p><form id="evaluation-form"><label>分类<select name="category"><option>黑点</option><option>挂起库</option><option>网络日报</option><option>其他</option></select></label><label>问题<input name="question" maxlength="500" required></label><label>预期能力<select name="expected_route">{% for route in routes %}<option value="{{ route }}">{{ route_labels[route] }}</option>{% endfor %}</select></label><button type="submit">保存测试题</button><span id="evaluation-form-status" role="status"></span></form><details><summary>从错误反馈中选择</summary><p>请先人工确认期望结果，再选择相应预期能力保存测试题。</p><div id="evaluation-feedback">展开后读取本机反馈。</div></details></section></main><script src="/static/evaluation.js"></script>{% include '_assistant.html' %}<script src="/static/assistant-utils.js"></script><script src="/static/assistant.js"></script></body></html>
